<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmO Graph</title>
    <style>
      :root {
        --bg: var(--oc-bg, #0a0b0d);
        --fg: var(--oc-fg, #f2f4f7);
        --muted: var(--oc-muted, #8b93a1);
        --subtle: color-mix(in srgb, var(--muted) 72%, var(--bg));
        --border: var(--oc-border, #23272f);
        --surface: var(--oc-elevated, #111318);
        --surface-2: var(--oc-muted-surface, #171a21);
        --accent: var(--oc-primary, #22d3ee);
        --accent-text: var(--oc-primary-text, var(--accent));
        --run: var(--oc-info, #22d3ee);
        --ok: var(--oc-success, #10b981);
        --warn: var(--oc-warning, #f59e0b);
        --bad: var(--oc-error, #f43f5e);
        --edge: color-mix(in srgb, var(--muted) 55%, transparent);
        --edge-in: var(--warn);
        --edge-out: var(--accent);
        --mono: var(--oc-mono, ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace);
        --font: var(--oc-font, ui-sans-serif, system-ui, sans-serif);
        --radius: var(--oc-radius, 8px);
        color-scheme: dark;
      }
      [data-oc-theme="light"] { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font); overflow: hidden; }
      button, input { font: inherit; color: inherit; }
      #world[hidden], #empty[hidden], #settings[hidden], #inspector[hidden] { display: none; }

      #app { display: flex; flex-direction: column; height: 100%; }
      .bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--border); min-height: 44px; }
      .bar .heading { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
      .bar .line { display: flex; align-items: center; gap: 7px; min-width: 0; }
      #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #meta { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tools { display: flex; gap: 2px; }
      .tool { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
      .tool:hover { background: var(--surface-2); color: var(--fg); }
      .tool:focus-visible { outline: 2px solid var(--oc-focus, var(--accent)); outline-offset: 1px; }
      .tool svg { width: 15px; height: 15px; }

      #settings { display: grid; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
      #settings label { display: grid; gap: 3px; font-size: 11px; color: var(--muted); }
      #settings input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font: 12px var(--mono); }
      #settings .row { display: flex; justify-content: flex-end; gap: 6px; }
      #settings button { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; }
      #settings button[type="submit"] { background: var(--accent); color: var(--oc-primary-fg, #001); border-color: transparent; }

      #viewport { position: relative; flex: 1; overflow: hidden; cursor: grab; touch-action: none;
        background-image: radial-gradient(color-mix(in srgb, var(--muted) 22%, transparent) 1px, transparent 1px);
        background-size: 18px 18px; }
      .is-panning #viewport { cursor: grabbing; }
      #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      #edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
      #nodes, #bands { position: absolute; inset: 0; }

      .band { position: absolute; top: 24px; height: 22px; font: 10.5px var(--mono); letter-spacing: .02em; color: var(--subtle); border-bottom: 1px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .band.is-live { color: var(--muted); border-bottom-color: color-mix(in srgb, var(--run) 70%, transparent); }

      .edge { fill: none; stroke: var(--edge); stroke-width: 1.3; transition: stroke .15s, opacity .15s, stroke-width .15s; }
      .edge.k-uses { stroke-dasharray: 5 4; stroke: color-mix(in srgb, var(--accent) 55%, var(--edge)); }
      .edge.is-live { stroke: color-mix(in srgb, var(--run) 65%, transparent); }
      .flow { fill: none; stroke: var(--run); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 0.06 0.94; animation: flow 1.6s linear infinite; opacity: .9; }
      @keyframes flow { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      #arrow path { fill: var(--edge); }
      @supports (fill: context-stroke) { #arrow path { fill: context-stroke; } }
      .has-hover .edge { opacity: .12; }
      .has-hover .flow { opacity: .15; }
      .has-hover .edge.is-reach:not(.is-in):not(.is-out) { opacity: .45; }
      .has-hover .edge.is-in { opacity: 1; stroke: var(--edge-in); stroke-width: 2.2; }
      .has-hover .edge.is-out { opacity: 1; stroke: var(--edge-out); stroke-width: 2.2; }

      .node { position: absolute; left: 0; top: 0; width: 232px; height: 80px; padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 1px;
        background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--radius) * .6); cursor: pointer;
        font: 11px/1.35 var(--mono); color: var(--muted); transition: opacity .15s, border-color .15s, box-shadow .15s, background .15s; }
      .node:hover, .node.is-hover { border-color: color-mix(in srgb, var(--fg) 40%, var(--border)); background: var(--surface-2); }
      .node:focus-visible { outline: 2px solid var(--oc-focus, var(--accent)); outline-offset: 2px; }
      .node.s-running { border-color: color-mix(in srgb, var(--run) 55%, var(--border)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--run) 18%, transparent), 0 0 18px -6px color-mix(in srgb, var(--run) 60%, transparent); }
      .node.s-failed { border-color: color-mix(in srgb, var(--bad) 55%, var(--border)); }
      .node.is-current { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent); }
      .node.k-root { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
      .has-hover .node { opacity: .3; }
      .has-hover .node.is-reach { opacity: .7; }
      .has-hover .node.is-hover, .has-hover .node.is-input, .has-hover .node.is-output { opacity: 1; }
      .has-hover .node.is-input { border-color: var(--edge-in); }
      .has-hover .node.is-output { border-color: var(--edge-out); }
      .n-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .n-title { color: var(--fg); font-weight: 600; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .n-status, .n-meta, .n-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .s-running .n-status { color: var(--run); }
      .s-completed .n-status { color: var(--ok); }
      .s-failed .n-status { color: var(--bad); }
      .s-queued .n-status { color: var(--warn); }
      .n-meta { color: var(--muted); }
      .n-sub { color: var(--subtle); }

      .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--subtle); }
      .dot.s-running { background: var(--run); animation: pulse 1.4s ease-in-out infinite; }
      .dot.s-completed { background: var(--ok); }
      .dot.s-failed { background: var(--bad); }
      .dot.s-queued { background: var(--warn); }
      .dot.s-cancelled { background: var(--subtle); }
      @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 60%, transparent); } 50% { box-shadow: 0 0 0 4px transparent; } }

      #empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px; padding: 24px; color: var(--muted); }
      #empty strong { color: var(--fg); font-size: 14px; }
      #empty p { margin: 0; max-width: 34ch; font-size: 12px; }

      #inspector { border-top: 1px solid var(--border); background: var(--surface); padding: 9px 12px 10px; display: grid; gap: 4px; font-size: 12px; max-height: 40%; overflow: auto; }
      .i-head { display: flex; align-items: center; gap: 7px; }
      #inspector .i-head strong { font-size: 12.5px; }
      .i-facts { font: 11px var(--mono); color: var(--muted); }
      .i-flow { display: flex; gap: 14px; font: 11px var(--mono); }
      .i-in { color: var(--edge-in); }
      .i-out { color: var(--edge-out); }
      .i-text { margin: 2px 0 0; color: var(--fg); opacity: .85; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .i-text.is-error { color: var(--bad); }
      .i-hint { font-size: 11px; color: var(--subtle); }

      @media (prefers-reduced-motion: reduce) {
        .flow { animation: none; stroke-dasharray: none; opacity: .5; }
        .dot.s-running { animation: none; }
        .node, .edge { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <div class="heading">
          <div class="line"><span id="title-dot" class="dot"></span><span id="title">OmO Graph</span></div>
          <div id="meta"></div>
        </div>
        <div class="tools">
          <button class="tool" id="btn-locate" type="button" title="Centre on the current or running agent" aria-label="Centre on the current or running agent">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
          </button>
          <button class="tool" id="btn-fit" type="button" title="Fit graph (0)" aria-label="Fit graph">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
          <button class="tool" id="btn-out" type="button" title="Zoom out (-)" aria-label="Zoom out">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
          </button>
          <button class="tool" id="btn-in" type="button" title="Zoom in (+)" aria-label="Zoom in">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5v14"/></svg>
          </button>
          <button class="tool" id="btn-settings" type="button" title="Data paths" aria-label="Data paths" aria-expanded="false" aria-controls="settings">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          </button>
        </div>
      </header>
      <form id="settings" hidden>
        <label>OmO agent directory <input name="agentDir" placeholder="~/.omo/agent (default, then ~/.pi/agent)" autocomplete="off" spellcheck="false" /></label>
        <label>Connector state directory <input name="stateDir" placeholder="~/.config/antechamber (default)" autocomplete="off" spellcheck="false" /></label>
        <div class="row"><button type="submit">Save</button></div>
      </form>
      <div id="viewport">
        <div id="world" hidden>
          <svg id="edges" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z"/></marker>
            </defs>
          </svg>
          <div id="bands"></div>
          <div id="nodes"></div>
        </div>
        <div id="empty"><strong>Loading…</strong></div>
      </div>
      <footer id="inspector" hidden aria-live="polite"></footer>
    </div>
    <script src="main.js"></script>
  </body>
</html>
