<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmO Work</title>
    <style>
      :root {
        --fg: var(--oc-fg, #f2f4f7);
        --muted: var(--oc-muted, #8b93a1);
        --subtle: color-mix(in srgb, var(--muted) 70%, transparent);
        --border: var(--oc-border, #23272f);
        --hover: var(--oc-hover, color-mix(in srgb, var(--fg) 6%, transparent));
        --surface: var(--oc-muted-surface, #171a21);
        --run: var(--oc-info, #22d3ee);
        --run-text: var(--oc-info-text, var(--run));
        --ok: var(--oc-success, #10b981);
        --warn: var(--oc-warning, #f59e0b);
        --bad: var(--oc-error, #f43f5e);
        --bad-text: var(--oc-error-text, var(--bad));
        --focus: var(--oc-focus, var(--run));
        --mono: var(--oc-mono, ui-monospace, "SF Mono", Menlo, monospace);
        --font: var(--oc-font, ui-sans-serif, system-ui, sans-serif);
        color-scheme: dark;
      }
      [data-oc-theme="light"] { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; color: var(--fg); font: 12px/1.45 var(--font); }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 4px; }
      #root { padding: 2px 4px 6px; display: grid; gap: 8px; }
      .group { display: grid; gap: 1px; }
      .label { display: flex; align-items: baseline; gap: 6px; padding: 0 4px 2px; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
      .label .count { font-family: var(--mono); letter-spacing: 0; text-transform: none; color: var(--subtle); }
      .row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 6px; min-height: 24px; padding: 2px 4px; border-radius: 5px; text-align: left; width: 100%; }
      button.row:hover, .row.is-open { background: var(--hover); }
      .row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .meta { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .side { display: flex; align-items: center; gap: 4px; font: 11px var(--mono); color: var(--muted); }
      .stack { display: grid; min-width: 0; text-align: left; }
      button.stack { width: 100%; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--subtle); justify-self: center; }
      .t-run .dot, .dot.t-run { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
      .t-ok .dot, .dot.t-ok { background: var(--ok); }
      .t-warn .dot, .dot.t-warn { background: var(--warn); }
      .t-bad .dot, .dot.t-bad { background: var(--bad); }
      @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 55%, transparent); } 50% { box-shadow: 0 0 0 3px transparent; } }
      .bar { width: 38px; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--muted) 25%, transparent); overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--ok); }
      .t-run .bar > i { background: var(--run); }
      .tasks { display: grid; gap: 0; padding: 1px 0 3px 22px; }
      .task { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 6px; align-items: start; padding: 1px 0; color: var(--muted); }
      .task .glyph { font: 10px/17px var(--mono); text-align: center; }
      .task.s-in_progress { color: var(--fg); }
      .task.s-in_progress .glyph { color: var(--run-text); }
      .task.s-completed .glyph { color: var(--ok); }
      .task.s-cancelled { text-decoration: line-through; opacity: .6; }
      .detail { margin: 0 4px 4px 22px; padding: 6px 8px; border-radius: 5px; background: var(--surface); display: grid; gap: 4px; min-width: 0; }
      .detail .kv { font: 11px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
      .detail pre { margin: 0; max-height: 140px; overflow: auto; font: 11px/1.4 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
      .action { height: 20px; padding: 0 7px; border-radius: 4px; border: 1px solid var(--border); font-size: 11px; color: var(--fg); }
      .action:hover { background: var(--hover); }
      .action.danger { color: var(--bad-text); }
      .action[disabled] { opacity: .5; cursor: default; }
      .note { padding: 2px 4px; color: var(--muted); }
      .note.is-error { color: var(--bad-text); }
      .settings { display: grid; gap: 6px; padding: 6px 8px; border-radius: 5px; background: var(--surface); }
      .settings label { display: grid; gap: 3px; font-size: 11px; color: var(--muted); }
      .settings input { padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--fg); font: 11px var(--mono); }
      .settings .buttons { display: flex; justify-content: flex-end; gap: 6px; }
      @media (prefers-reduced-motion: reduce) { .t-run .dot, .dot.t-run { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root" aria-live="polite"></div>
    <script src="main.js"></script>
  </body>
</html>
