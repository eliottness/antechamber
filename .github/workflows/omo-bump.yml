name: OmO bump

# Weekly: move the omo-ai pin to the latest release and prove it against the latest OpenChamber. The bump commit is
# pushed to omo-bump/<version>, which runs CI on it, and is checked end to end here. When everything passes it is
# pushed to main with the release deploy key, and that push releases it (release.yml). When anything fails the
# run fails and the branch stays for a maintainer to fix on. A run started on any other branch is a dry run: it bumps and checks that branch, then deletes the bump branch instead of shipping.
# See RELEASE.md.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: omo-ai version (default the latest)
        required: false

permissions:
  contents: read

concurrency:
  group: omo-bump
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      from: ${{ steps.bump.outputs.from }}
      to: ${{ steps.bump.outputs.to }}
      branch: ${{ steps.bump.outputs.branch }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          # The deploy key's pushes start workflows (CI on the branch); GITHUB_TOKEN pushes start none.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Bump omo-ai and push omo-bump/<version>
        id: bump
        run: |
          moved="$(npx tsx scripts/omo-bump.ts "$VERSION")"
          if [ -z "$moved" ]; then
            echo "omo-ai is already at $(node -p 'require("./package.json").dependencies["omo-ai"]')"
            exit 0
          fi
          read -r from to <<< "$moved"
          branch="omo-bump/$to"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "chore(deps): bump omo-ai from $from to $to"
          git push --force origin "HEAD:refs/heads/$branch"
          {
            echo "from=$from"
            echo "to=$to"
            echo "branch=$branch"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "### omo-ai $from -> $to on \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ inputs.version }}

  # The branch push runs the full CI matrix (Linux, macOS, Bun); wait for its verdict rather than duplicate it.
  ci:
    needs: prepare
    if: needs.prepare.outputs.to != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for CI on the bump commit
        run: |
          id=""
          for _ in $(seq 1 60); do
            id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push \
              --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$id" ] && break
            sleep 10
          done
          test -n "$id" || { echo "CI never started for $SHA"; exit 1; }
          echo "CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
          gh run watch "$id" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}

  e2e:
    needs: prepare
    if: needs.prepare.outputs.to != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: npm ci
      - run: npm run build
      # The model is a local OpenAI-compatible mock (scripts/ci/mock-openai.mjs): no provider, key or tokens.
      - name: Latest OpenChamber drives the bumped OmO through the extension launcher
        run: scripts/ci/openchamber-e2e.sh

  ship:
    needs: [prepare, ci, e2e]
    if: needs.prepare.outputs.to != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Dry run, delete the bump branch
        if: github.ref != 'refs/heads/main'
        run: |
          git push origin --delete "$BRANCH"
          echo "### Dry run on $GITHUB_REF_NAME: omo-ai $TO passed CI and the end-to-end run; not shipped" >> "$GITHUB_STEP_SUMMARY"
        env:
          BRANCH: ${{ needs.prepare.outputs.branch }}
          TO: ${{ needs.prepare.outputs.to }}
      # main only takes the exact commit CI and the end-to-end run tested.
      - name: Fast-forward main to the bump and release it
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch -q origin "$BRANCH"
          if ! git merge -q --ff-only FETCH_HEAD; then
            echo "::warning::main moved during the bump; run OmO bump again to retest on the new main"
            exit 0
          fi
          git push origin HEAD:main
          git push origin --delete "$BRANCH"
          echo "### Shipped omo-ai $TO; the release workflow publishes it" >> "$GITHUB_STEP_SUMMARY"
        env:
          BRANCH: ${{ needs.prepare.outputs.branch }}
          TO: ${{ needs.prepare.outputs.to }}
