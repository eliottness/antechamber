name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: CHANGELOG must have a section for this version
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no '## [$VERSION]' section"; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Trusted publishing (OIDC) is used when configured on npmjs.com; an
      # NPM_TOKEN repository secret works as a fallback (needed for the very
      # first publish, before the package exists on the registry).
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Installable from OpenChamber by URL: .../releases/latest/download/antechamber-omo-graph.zip
      - name: Package the OmO Graph extension
        run: npm run pack:extension -- "$RUNNER_TEMP/antechamber-omo-graph.zip"
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/antechamber-omo-graph.zip" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
