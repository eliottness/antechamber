name: CI

on:
  push:
  pull_request:

jobs:
  # The published CLI runs on Bun; development tooling (tsc, tsx tests, esbuild) stays on Node.
  bun-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: [1.4.x, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: npm ci
      - run: npm run build
      - name: Doctor reports the Bun runtime
        run: |
          bun dist/cli.js doctor --json > "$RUNNER_TEMP/doctor.json" || true
          bun -e 'const r = JSON.parse(await Bun.file(process.argv[1]).text()); const c = r.checks.find((x) => x.name === "bun"); if (c?.status !== "PASS") throw new Error(JSON.stringify(c)); console.log(c.message)' "$RUNNER_TEMP/doctor.json"
      - name: Serve a turn through the launcher shim under Bun
        run: |
          set -eu
          bun dist/cli.js version | grep -qF "antechamber $(bun -p 'require("./package.json").version') "
          state="$(mktemp -d)"
          mkdir "$state/agent"
          ANTECHAMBER_STATE_DIR="$state" ANTECHAMBER_PI_BINARY="$PWD/test/fixtures/turn-omo.mjs" PI_CODING_AGENT_DIR="$state/agent" \
            bin/opencode-antechamber serve --hostname 127.0.0.1 --port 4096 > "$state/out.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat "$state/out.log"' EXIT
          for _ in $(seq 1 100); do grep -q '^opencode server listening on http://127.0.0.1:4096$' "$state/out.log" && break; sleep 0.1; done
          ps -o command= -p "$server" | grep -q 'bun .*dist/cli.js serve'
          curl -fsS http://127.0.0.1:4096/global/health | grep -q '"healthy":true'
          session="$(curl -fsS -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:4096/api/session | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).data.id)')"
          curl -fsS -X POST -H 'content-type: application/json' -d '{"text":"hello"}' "http://127.0.0.1:4096/api/session/$session/prompt" > /dev/null
          for _ in $(seq 1 100); do
            curl -fsS "http://127.0.0.1:4096/api/session/$session/message" | bun -e 'const m = JSON.parse(await Bun.stdin.text()); process.exit(m.data.some((x) => x.type === "assistant") ? 0 : 1)' && break
            sleep 0.1
          done
          curl -fsS "http://127.0.0.1:4096/api/session/$session/message" | bun -e 'const m = JSON.parse(await Bun.stdin.text()); if (!m.data.some((x) => x.type === "assistant")) throw new Error(JSON.stringify(m).slice(0, 500))'
          kill -TERM "$server"
          wait "$server"
      - name: Install and serve the runtime through the extension launcher
        run: |
          set -eu
          work="$(mktemp -d)"
          npm pack --pack-destination "$work" > /dev/null
          export ANTECHAMBER_RUNTIME_DIR="$work/runtime" ANTECHAMBER_RUNTIME_SPEC="$(ls "$work"/antechamber-*.tgz)"
          launcher=extensions/antechamber/bin/opencode-antechamber
          test "$($launcher --version)" = "$(bun dist/cli.js --version)"
          test ! -e "$ANTECHAMBER_RUNTIME_DIR"
          $launcher upgrade | grep -q 'Settings -> Extensions'
          mkdir "$work/agent"
          ANTECHAMBER_STATE_DIR="$work/state" ANTECHAMBER_PI_BINARY="$PWD/test/fixtures/turn-omo.mjs" PI_CODING_AGENT_DIR="$work/agent" \
            $launcher serve --hostname 127.0.0.1 --port 4097 > "$work/out.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat "$work/out.log"' EXIT
          for _ in $(seq 1 1200); do grep -q '^opencode server listening on http://127.0.0.1:4097$' "$work/out.log" && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:4097/global/health | grep -q '"healthy":true'
          ls "$ANTECHAMBER_RUNTIME_DIR"/local-*/node_modules/omo-ai/bin/omo.js
          kill -TERM "$server"
          wait "$server"

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Verify published package contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/package.json"
          node --input-type=module - "$RUNNER_TEMP/package.json" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const [pack] = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const paths = pack.files.map(({ path }) => path);
          assert.ok(paths.includes("dist/cli.js"), "package must contain dist/cli.js");
          for (const file of ["package.json", "icon.svg", "bin/opencode-antechamber", "panel/index.html", "panel/main.js", "status/index.html", "status/main.js", "service/main.js", "runtime/launcher.js"])
            assert.ok(paths.includes(`extensions/antechamber/${file}`), `package must contain the built antechamber extension (${file})`);
          assert.ok(!paths.some((path) => /^extensions\/omo-/.test(path)), "package must not contain the retired omo-* extensions");
          assert.ok(!paths.some((path) => /^extensions\/[^/]+\/(src|test|scripts)\//.test(path)),
            "package must not contain extension sources or tests");
          assert.ok(!paths.some((path) => /^(test|contrib)\//.test(path)),
            "package must not contain test/ or contrib/");
          NODE

  # Runs the darwin process-table and teardown paths against the real /bin/ps and lsof.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
